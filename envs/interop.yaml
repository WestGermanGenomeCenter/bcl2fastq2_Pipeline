name: interop
channels:
  - nodefaults
  - http://conda.repo.test.hhu.de/conda-forge
  - http://conda.repo.test.hhu.de/bioconda
  - http://conda.repo.test.hhu.de/main
        
dependencies:
  - gnuplot
  - illumina-interop=1.9.0
  - libjpeg-turbo
  - pandas
  - reportlab
  - seaborn
  - matplotlib
  - numpy
  - pypdf2
  - pip # if interop fails for you: disable  / delete the lines 18-20 on the hpc in this env.yaml, then let the rule fail once, then activate the env, then install interop via pip inside that env manually.
  - pip: 
      - interop 
