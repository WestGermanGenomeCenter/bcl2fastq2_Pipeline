# this function is now using bcl convert, but the name is still the same. 
# setting a samplesheet with a project number in the filename and a output folder are the only 2 mandatory things for each run!!
demux:
  SampleSheet:
        /gpfs/project/projects/bmfz_gtl/devices/illumina/nextseq2000/260107_VL00286_323_AAHMFLVM5/1399_Samplesheet.csv # this must be the sequencing device output folder if you want to demultiplex! put the samplesheet into that folder, including project number as part of the samplesheet filename.
  OutputFolder:
        "/gpfs/project/projects/bmfz_gtl/projects/1399_test1_dr" # DO NOT end with / - just the complete dir path!!! 

  options: "--no-lane-splitting true " # any extra command line parameters given to bclconvert.
  bcl_convert_path: 
 #       "/gpfs/project/projects/bmfz_gtl/software/bclconvert/scripts/bcl-convert" # bcl-convert Version 00.000.000.4.2.7 
        "/gpfs/project/projects/bmfz_gtl/software/illumina/bcl_convert_436/bcl-convert" # bcl-convert Version 00.000.000.4.3.6 <- bcl-convert is the executable here # / not allowed at the end
  demux_try1_gb: 96 # 96 GB ram for the first demultiplex try with bclconvert is reasonable ; 126 at least for novaseqx
  use_bcl2fastq: False # use for miseq runs, if bclconvert gives errors
  bcl2fastq2_path: 
          "/gpfs/project/projects/bmfz_gtl/software/illumina/bcl2fastq" # <-bcl2fastq is here the executable
  bcl2fastq_mismatches: 1
  bcl2fastq_options: "--no-lane-splitting"

# if you did already demultiplex, activate this here. # put all .fastq.gz files into that folder # change outputfolder above and the fastq_folder below accordingly
skip_demux:
  skip_demux_active: False
  fastq_folder: "/gpfs/project/projects/bmfz_gtl/projects/1162_Konkat/Konkat+Trimmed/fastq" #<- inside that folder are the .fastq.gz files expected then (untrimmed) # / not allowed at the end

### PE-Disclaimer:
# if running pe-sequencing, the samples MUST be in ..._R1_001.fastq.gz/ ..._R2_001.fastq.gz naming, if not the pipeline will probably fail, rename the .fastq.gz files if needed!

# for some reason, in some cases, bcl convert thinks that making the read 3 the reverse complement from the sequence in the samplesheet makes sense. 
# we think differently, so there is a helper function that changes the settings in the RunInfo.xml. Keep this always inactive else you know better!
prevent_revcomp:
    prevent_revcomp_active: False

# this adds a few plots after each demultiplexing that usually can just be seen in SAV. Now also adds a report pdf file that can be shared with others if needed.
interop_plots:
    interop_plots_active: True    #only makes sense if demultiplexing is active, needs the illumina output folder
#    interop_binaries_dir: "/gpfs/project/projects/bmfz_gtl/software/illumina/interop-1.9.0-Linux-GNU/bin" # to get the files: go here: https://github.com/Illumina/interop/releases/tag/v1.4.0, download the .tar.gz, unpack, then the in bin/ included files need to be in the folder here
#    interop_script_path: "/gpfs/project/projects/bmfz_gtl/software/bclconvert/scripts" # / not allowed at the end
      
# cutadapt removes pre-defined adapters and can trim reads by quality/ length.
# for each adapter sequence an adapter_type needs to be added aswell!       
cutadapt: 
  cutadapt_active: True
  adapters: 
    - AGATCGGAAGAGCACACGTCTGAACTCCAGTCA    
    - CTGTCTCTTATACACATCT
    - AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT
    - ACACTCTTTCCCTACACGACGCTCTTCCGATCT

  adapter_type: 
    - b # b for can be at both ends, a and g are for adapters expected on specific ends. b makes it more general, filtering a little better
    - b
    - b
    - b
  other_params: "--minimum-length 25 --quality-cutoff 5 -n 2" # very conservative, should work with any assay.

mapping: # transcriptome mapping happens here with STAR
  mapping_active: True
#  gtf_file: "/gpfs/project/projects/bmfz_gtl/software/reference_genomes/hg38/star_2710b_hg38_ensembl/Homo_sapiens.GRCh38.111.gtf" 
#  genomeDir: "/gpfs/project/projects/bmfz_gtl/software/reference_genomes/hg38/star_2710b_hg38_ensembl" # / not allowed at the end
  gtf_file: "/gpfs/project/projects/bmfz_gtl/software/reference_genomes/mouse_ensembl/Mus_musculus.GRCm39.111.gtf"
  genomeDir: "/gpfs/project/projects/bmfz_gtl/software/reference_genomes/mouse_ensembl"
  other_params: ""
  stranded: "-s 2 " # featurecounts parameter -s , adapt this to paired ("-p") if paired- end sequencing, else "-s 1" for forward stranded, "-s 0" for unstranded and "-s 2" for reverse strandedness"
  stringtie_on: True # if mapping is disabled, but one of these options is enabled - mapping will happen anyway
  rseqc_active: False #  qc of mapping, somewhat redundant to qualimap:	rseqc and qualimap do the same,	just in	different ways:	for now	please just enable one of the two, i would prefer qualimap
  qualimap_on: True # for this to work you need to manually create Qualimap env with qualimap=2.3 [--no-deps] installed, or use the local installment:
  qualimap_parameters: "-p strand-specific-reverse" # for qualimap to work properly, you need to set the strandedness, otherwise it assumes unstrandedness: -p strand-specific-reverse strand-specific-forward, strand-specific-reverse or non-strand-specific
  qualimap_dir: "/gpfs/project/projects/bmfz_gtl/software/qualimap/qualimap_2_3/qualimap_v2.3" # an executable of qualimap needs to be in that folder, / not allowed at the end
  rmats_on: True
  rmats_read_length: 100 # length of input reads. sequenced length minus umi, minus spacer, minus adapter.
  rmats_paired: "single --libType fr-secondstrand" # Type of read used in the analysis: either "paired" for paired-end data or "single" for single-end data. Default: paired +   --libType {fr-unstranded,fr-firststrand,fr-secondstrand}                         Library type. Use fr-firststrand or fr-secondstrand for strand-specific data. Only relevant to the prep step, not the post step. Default: fr-unstranded
  rmats_group_file: "/gpfs/project/projects/bmfz_gtl/projects/1399/star/groups.txt"


# preseq is a tool to estimate sequencing saturation # this can be useful to check if more sequencing would be helpful to capture or if a saturation is already reached
preseq:
    preseq_active: True # only works when mapping is active, needs no references 

# umi_tools is used in two steps to first move the umis from a defined position of the trimmed read to the read header inside the .fastq.gz files # and then after mapping with star deduplicate the mapped reads based on position and umi in the .bam files 
umi_tools: # for this to work, cutadapt needs to be active 
  umi_tools_active: False
 # pattern: '".+(?P<umi_1>.{8})(?P<discard_1>G{3,5})"' # TaKaRa: 8nt umi at 5' + 3-5Gs at the end  of the read {s<=2}
  pattern: '"(?P<umi_1>.{6})(?P<discard_1>TATA){s<=1}.+"' # Lexogen: 6nt umi + tata = 10nt UMI , allowing one mismatch in the spacer 
 # pattern: '"(?P<umi_1>.{6})(?P<discard_1>TATA).+"' # Lexogen: 6nt umi + tata = 10nt UMI , always with single and double quotes! 
  pattern2: '""' # umi pattern for the second read if needed, only possible in paired-end sequencing setups

# blast is used as a quick proxy for sample species estimation. only a small subset are blasted (blastn ) versus a reference-only database that is quite small only for trimmed reads as the adapter can confuse its results. # outputs a table and a summary file. also subsamples reads to speedup the process for each input file. 
blast: # for this to work, cutadapt needs to be active
    blast_active: False    #
    blast_db: "/gpfs/project/projects/bmfz_gtl/software/blast/bigger_blastdb/bmfz_blast_big_db" # also possible: /gpfs/project/projects/bmfz_gtl/software/blast/nt /gpfs/project/projects/bmfz_gtl/software/blast/bmfz_blastdb_input.fa much smaller, but annotated
    blast_script_dir: "/gpfs/project/projects/bmfz_gtl/software/bclconvert/scripts"

# kraken2 is used to identify the species sequenced. helpful for contamination detection.based on kmers. using a shared database!  # since it needs 180gb of ram, these jobs are slow to start on the hpc
kraken2:
  kraken2_active: True   #
  kraken2_database: "/gpfs/project/databases/Kraken2-2022-09-28/kraken_db_plus" # also possible: /gpfs/project/databases/Kraken2_refseq+hfmv # also possible: /gpfs/project/projects/bmfz_gtl/software/Kraken

# kaiju is for metagenomic data only, if kraken/biobloom/blast/diamond give not a clear result, try this here
kaiju:
  kaiju_active: False
  kaiju_db: "/gpfs/project/projects/bmfz_gtl/software/kaiju/kaiju_db_refseq_nr.fmi" 
  kaiju_nodes_dmp: "/gpfs/project/projects/bmfz_gtl/software/kaiju/nodes.dmp"
  kaiju_names_dmp: "/gpfs/project/projects/bmfz_gtl/software/kaiju/names.dmp"

# jellyfish is used to compute 21-mers for DNA samples. This can be used to check quality and ploidity of samples. # use for whole-genome sequencing assays
jellyfish:
  jellyfish_active: False #

# biobloom is for taxonomic classification of reads based on k-mers. needs one new biobloom filter for each species screened for. # use only if kraken, diamond and blast are non-overlapping nor conclusive
biobloom:
  biobloom_active: False
  biobloom_filter_dir: "/gpfs/project/projects/bmfz_gtl/databases/biobloom/" # / at the end needed 
  biobloom_filters: '"Acetobacter_tropicalis.bf Amborella_trichopoda.bf Aquilegia_eximia.bf arabidopsis_tair10.bf Aspergillus_flavus.bf bac_subtilis_168.bf c_elegans.bf coffee.bf cottus_rhenaus.bf crayfish_gca.bf eColi_mg16.bf elephant_seal.bf fruitfly.bf fungus.bf human_hs1.bf Leishmania_major.bf lichen.bf mite.bf moss_Phypa_V3.bf mouse_mm39.bf mycoplasma_hyopneumoniae.bf Plasmodium_falciparum.bf rat_rn7.bf soybean_GlyMax.bf Toxoplasma_gondii.bf wheat.bf yeast_R64.bf Yersinia_kristensenii.bf zebrafish.bf "'

# sourmash is a k-mer based tool that aims to be better than kraken, here used with eukaryote-only and microbial db
sourmash:
  sourmash_active: False  #
  sourmash_eukaryote_ref: "/gpfs/project/projects/bmfz_gtl/databases/sourmash/ncbi-euks-all-2025.01-k51.dna.rocksdb"
  sourmash_microbial_ref: "/gpfs/project/projects/bmfz_gtl/databases/sourmash/gtdb-rs226-k51.dna.rocksdb" 

# sortmerna counts rRNA from input files, splitting the .fastq in the process.  # needs cutadapt and/ or umi_tools to be active
sortmerna:
  sortmerna_active: False
  sortmerna_reference_list: '  --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/rfam-5.8s-database-id98.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/rfam-5s-database-id98.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/silva-arc-23s-id98.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/silva-bac-23s-id98.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/silva-euk-28s-id98.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/silva-euk-18s-id95.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/silva-bac-16s-id90.fasta --ref /gpfs/project/projects/bmfz_gtl/databases/sortmerna/silva-arc-16s-id95.fasta'


# crypt4gh encryption of umi_extract/cutadapt output files. needs both files to be present on the same filesystem as files # use only for human data, only transfer the files in the /encrypted_fastqs/ folder 
crypt4gh:
  crypt4gh_active: False
  crypt4gh_own_private_key: "/home/daric102/daric102_nop.sec"
  crypt4gh_client_public_key_dir: "/gpfs/project/projects/bmfz_gtl/software/c4gh_public_keys/" # recipient and all gtl public keys that can decrypt later / at the end needed 

# not used for now, can transfer only unencrypted folders to places such as notfallserver. needs a login-less connection to work.
transfer:
  transfer_active: False
  transfer_to: "134.99.204.8:/mnt/data/pipelines/" # / at the end needed 
  transfer_as: "daniel@"

# fastqc also now adds a fastp report. there some additional infos that can be found such as the base-specific phred score for each .fastq file.
others:

# use this only when absolutely needed, in a screen session! pw needs to be manually typed in after all analysis are done.
gocryptfs:
  gocryptfs_active: False
  gocryptfs_version: gocryptfs/1.7.1

